const notifSnd=mkSnd(NOTIF_SRC);
const sndBtn=$('snd');
function paintSnd(){sndBtn.classList.toggle('off',sndMuted);sndBtn.setAttribute('aria-pressed',sndMuted?'true':'false');sndBtn.setAttribute('aria-label',sndMuted?'Звук выключен':'Звук включён')}
sndBtn.onclick=()=>{sndMuted=!sndMuted;try{localStorage.setItem('pmk-mute',sndMuted?'1':'0')}catch(err){}paintSnd();if(!sndMuted)clickSnd()};
paintSnd();
$('days').onclick=e=>{const b=e.target.closest('.d');if(b){clickSnd();go(b.dataset.d)}};
$('today').onclick=()=>go(todayS());
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.mode=b.dataset.m;persist();render()};
addEventListener('keydown',e=>{
if($('ov').classList.contains('show')){if(e.key==='Escape')closeSheet();return}
if($('dev').classList.contains('show')){if(e.key==='Escape')$('dev').classList.remove('show');return}
if($('set').classList.contains('show')){if(e.key==='Escape')$('set').classList.remove('show');return}
if(e.target.tagName==='INPUT')return;
if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);
});
let tx=0,ty=0;
$('main').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('main').addEventListener('touchend',e=>{
const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
if(Math.abs(dx)>70&&Math.abs(dy)<45){swipeSnd();step(dx<0?1:-1)}
},{passive:true});
let shMode='group',shCb=null,shCur='';
function openSheet(mode=st.mode,cb=null,cur=st.ent[mode]){
shMode=mode;shCb=cb;shCur=cur;
$('q').value='';$('q').placeholder={group:'Найти группу',teacher:'Найти преподавателя',aud:'Найти аудиторию'}[mode];
fillSheet();$('ov').classList.add('show');setTimeout(()=>$('q').focus(),480);
}
function closeSheet(){$('ov').classList.remove('show')}
function fillSheet(){
const q=$('q').value.trim().toLowerCase();

(function(){
(function(){
const d=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
if(!d||!d.set)return;
['out','days'].forEach(id=>{
const el=$(id);if(!el)return;
Object.defineProperty(el,'innerHTML',{configurable:true,
get(){return d.get.call(this)},
set(v){if(this.__h===v&&this.firstChild)return;this.__h=v;d.set.call(this,v)}});
});
})();
const out=$('out'),hdr=document.querySelector('header'),seg=$('seg'),days_=$('days'),ent=$('ent'),sub=$('sub');
const reflow=(el,c)=>{el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(()=>el.classList.remove(c),900)};
let lastSig='',lastDay=st.day,lastEnt='',lastMode=st.mode;
const ind=document.createElement('span');ind.className='seg-i nt';seg.prepend(ind);
function moveInd(instant){
const b=seg.querySelector('button.on');if(!b)return;
const ck=b.dataset.m+'|'+seg.clientWidth;if(!instant&&ind.__ck===ck)return;
if(!b.offsetWidth)return;ind.__ck=ck;
if(instant)ind.classList.add('nt');
ind.style.width=b.offsetWidth+'px';ind.style.transform=`translateX(${b.offsetLeft-3}px)`;
if(instant){void ind.offsetWidth;ind.classList.remove('nt')}
}
addEventListener('resize',()=>moveInd(true));
document.fonts&&document.fonts.ready.then(()=>moveInd(true));
let sc=false,scT=0;

const v=scrollY>6;if(v!==sc){sc=v;hdr.classList.toggle('sc',v)}
};
addEventListener('scroll',onScroll,{passive:true});
function anim(prevScroll){
document.documentElement.style.setProperty('--ph',(Date.now()%12000)+'ms');
moveInd(!ind.style.width);
const hasContent=out.querySelector('.row,.empty,.card');
const key=st.ent[st.mode]||'';
const sig=st.day+'|'+st.mode+'|'+key;
const splashOn=document.getElementById('splash');
let base=0;
if(splashOn&&!splashOn.classList.contains('out'))base=Math.max(0,2900-(Date.now()-splashStart)-150);
if(key!==lastEnt||st.mode!==lastMode){reflow(ent,'swap');lastEnt=key;lastMode=st.mode}
if(st.day!==lastDay){
const on=days_.querySelector('.d.on');
if(on){
reflow(on,'pop');
const target=on.offsetLeft-(days_.clientWidth-on.offsetWidth)/2;
days_.scrollLeft=prevScroll;
days_.scrollTo({left:target,behavior:'smooth'});
}
reflow(sub,'swapS');
}
const enter=hasContent&&(sig!==lastSig||base>0);
if(enter){
out.style.setProperty('--dx',st.day===lastDay?0:(st.day>lastDay?1:-1));
[...out.children].forEach((el,i)=>el.style.setProperty('--d',(base+Math.min(i,9)*55)+'ms'));
out.classList.add('enter');document.documentElement.classList.add('busy');window.__qSample&&window.__qSample();
lastSig=sig;
clearTimeout(out.__et);out.__et=setTimeout(()=>{out.classList.remove('enter');document.documentElement.classList.remove('busy')},base+1700);
}else out.classList.remove('enter');
if(hasContent)lastDay=st.day;
}

(function(){
const root=document.documentElement,STEPS=[30,48,60,72,90,100,120,144,165,240];
let busy=false;
window.__measureHz=function(frames){
frames=frames||60;
if(busy||document.hidden)return Promise.resolve(window.__hz||0);
busy=true;
return new Promise(res=>{
const d=[];let last=0;
function f(t){
if(last)d.push(t-last);last=t;
if(d.length<frames&&!document.hidden){requestAnimationFrame(f);return}
busy=false;
if(d.length>8){
d.sort((a,b)=>a-b);
const raw=1000/d[d.length>>1];
const hz=STEPS.reduce((b,x)=>Math.abs(x-raw)<Math.abs(b-raw)?x:b,60);
window.__hzRaw=Math.round(raw);window.__hz=hz;
root.dataset.hz=hz;root.style.setProperty('--hz',hz);
root.classList.toggle('hi-hz',hz>=90);
}
res(window.__hz||0);
}
requestAnimationFrame(f);
});
};
setTimeout(()=>window.__measureHz(),5000);   /* после заставки и «лайт»-замера */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>window.__measureHz(),800)});
})();
(function(){
const C=window.Capacitor,P=C&&C.Plugins,root=document.documentElement;
if(!P)return;
let ok=false;
try{
const SB=P.StatusBar;
if(SB){
SB.setOverlaysWebView&&SB.setOverlaysWebView({overlay:true});
SB.setBackgroundColor&&SB.setBackgroundColor({color:'#00000000'});
ok=true;
}
}catch(e){}
try{ if(P.SystemBars){ok=true} }catch(e){}
if(!ok)return;
root.classList.add('edge');
setTimeout(()=>{
try{
const t=document.createElement('div');
t.style.cssText='position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden';
const b=document.createElement('div');
b.style.cssText='position:fixed;bottom:0;left:0;width:0;height:env(safe-area-inset-bottom,0px);visibility:hidden';
document.body.append(t,b);
if(!t.offsetHeight)root.style.setProperty('--sat','28px');
if(!b.offsetHeight)root.style.setProperty('--sab','0px');
t.remove();b.remove();
}catch(e){}
},400);
})();
(function(){
let el=null,on=false,raf=0,n=0,t0=0,last=0,worst=0;
function frame(t){
if(!on)return;
if(!t0){t0=t;last=t}
worst=Math.max(worst,t-last);last=t;n++;
if(t-t0>=500){
const fps=Math.round(n*1000/(t-t0)),min=Math.round(1000/worst),hz=window.__hz||60;
const r=fps/hz,c=r>.9?'#4ade80':r>.6?'#facc15':'#f87171';
el.innerHTML=`<b style="color:${c}">${fps}</b> FPS<small> · мин ${min} · ${hz} Гц</small>`;
n=0;t0=t;worst=0;
}
raf=requestAnimationFrame(frame);
}
window.__toggleFps=function(){
on=!on;window.__fpsOn=on;
if(on){
if(!el){
el=document.createElement('div');
el.style.cssText='position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:8px;z-index:9999;pointer-events:none;background:rgba(0,0,0,.72);color:#fff;font:600 13px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:6px 9px;border-radius:10px';
document.body.appendChild(el);
}
el.style.display='';el.textContent='…';n=0;t0=0;worst=0;
raf=requestAnimationFrame(frame);
}else{
cancelAnimationFrame(raf);if(el)el.style.display='none';
}
};
})();
(function(){
try{localStorage.removeItem('pmk-lite');localStorage.removeItem('pmk-q2')}catch(e){}
document.documentElement.classList.remove('lite','q1');

})();
anim(days_.scrollLeft);
})();
